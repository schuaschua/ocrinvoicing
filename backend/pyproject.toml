[project]
name = "invoicing"
# The version lives in src/invoicing/__init__.py, so GET /api/health reports it
# from the deployed package itself (no installed distribution metadata needed).
dynamic = ["version"]
description = "OCR Invoice Automation PoC back end (Azure Functions, Python v2 model)"
requires-python = "==3.13.*"
# Runtime dependencies (Story 1.3), pinned exactly; Pydantic follows the spine's Stack
# table. aiohttp is the async transport azure-core needs for the aio queue client.
# azure-data-tables (Story 1.7) reads the supplier link registry (AD-6);
# azure-storage-blob (Story 1.8) writes upload originals to `images` (AD-6);
# azure-keyvault-secrets (Story 1.6) reads the public and HMAC keys for the supplier
# load script (AD-11).
# Story 2.1: SQLAlchemy Core, psycopg (binary: the Flex image ships no libpq) and
# Alembic follow the spine's Stack table; Pillow, ImageHash and pypdf are the quality
# stage's readability check, phash (AD-9) and PDF page count (AD-6).
dependencies = [
    "aiohttp==3.14.3",
    "alembic==1.20.0",
    "azure-functions==2.3.0",
    "azure-data-tables==12.7.0",
    "azure-identity==1.25.3",
    "azure-keyvault-secrets==4.11.2",
    "azure-monitor-opentelemetry==1.8.10",
    "azure-storage-blob==12.30.3",
    "azure-storage-queue==12.17.0",
    "imagehash==4.3.2",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pypdf==6.19.0",
    "sqlalchemy==2.1.1",
]

[dependency-groups]
# Check tools for ci/checks.sh (Story 1.2), pinned exactly so CI is reproducible.
dev = [
    # Story 2.4: the AD-10 import rule below ([tool.importlinter]).
    "import-linter==2.15",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/invoicing/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/invoicing"]

# coding-style.md section 1: ruff defaults plus I, B, UP and S.
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest's assert statements are the test mechanism, not a runtime check (S101).
"tests/**" = ["S101"]

# coding-style.md section 1: mypy default everywhere, strict for the domain package.
[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
# Pydantic models and settings take their fields as keyword arguments or from the environment.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The per-module equivalent of --strict (the flag itself is global-only).
module = ["invoicing.domain", "invoicing.domain.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

# AD-10 (Story 2.4): only the purchasing simulation touches its schema, and only the
# composition code (the adapter factory the apps call, and the operator seed command)
# imports it. ci/checks.sh lint runs `lint-imports`; tests/test_story_2_4_import_rule.py
# also checks no other source file names the schema.
[tool.importlinter]
root_package = "invoicing"

[[tool.importlinter.contracts]]
id = "purchasing-sim-is-private"
name = "AD-10: only the adapter factory and the seed command import the purchasing simulation"
type = "protected"
protected_modules = ["invoicing.adapters.purchasing_sim"]
allowed_importers = [
    "invoicing.adapters.purchasing_factory",
    "invoicing.tools.seed_purchasing",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "app(name): the app whose settings the app_settings fixture sets (tests/conftest.py)",
]

# Backend coverage floor (Story 1.2, coding-style.md rule 25). ci/checks.sh passes
# the same value; never lower it to make a check pass.
[tool.coverage.run]
source = ["invoicing"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
