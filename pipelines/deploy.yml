# Deploy pipeline (Story 1.2, spine AD-17). Every merge to `main` runs the stacks in
# the AD-17 order, each from a saved plan of this run:
#   shared/foundation -> dev/foundation -> Dev migrations -> dev/app -> Dev code
#   -> prod/foundation -> Prod migrations -> prod/app -> Prod code
# Dev applies automatically (terraform.md rules 26/33 exception). `shared` and `prod`
# apply only through the ADO environments `shared` and `prod`, whose approval check
# (Dj) and exclusive lock are set by infra/bootstrap/ado-setup.sh. A failed step
# stops the sequence. Operator steps (AD-17 1, 3, 4b, 5, 8) never run here.
trigger:
  batch: true # one run at a time; merges during a run are batched into the next
  branches:
    include:
      - main
pr: none

# Runs wait for the exclusive lock on each environment instead of overlapping.
lockBehavior: sequential

stages:
  - template: templates/terraform-stack.yml
    parameters:
      id: shared_foundation
      stack: shared/foundation
      environment: shared
      serviceConnection: azure-shared

  - template: templates/terraform-stack.yml
    parameters:
      id: dev_foundation
      stack: dev/foundation
      environment: dev
      serviceConnection: azure-dev
      after: shared_foundation

  - template: templates/migrate.yml
    parameters:
      id: dev_migrate
      environment: dev
      serviceConnection: azure-dev
      after: dev_foundation

  - template: templates/terraform-stack.yml
    parameters:
      id: dev_app
      stack: dev/app
      environment: dev
      serviceConnection: azure-dev
      after: dev_migrate
      optional: true

  - template: templates/code-deploy.yml
    parameters:
      id: dev_code
      environment: dev
      serviceConnection: azure-dev
      after: dev_app

  - template: templates/terraform-stack.yml
    parameters:
      id: prod_foundation
      stack: prod/foundation
      environment: prod
      serviceConnection: azure-prod
      after: dev_code

  - template: templates/migrate.yml
    parameters:
      id: prod_migrate
      environment: prod
      serviceConnection: azure-prod
      after: prod_foundation

  - template: templates/terraform-stack.yml
    parameters:
      id: prod_app
      stack: prod/app
      environment: prod
      serviceConnection: azure-prod
      after: prod_migrate
      optional: true

  - template: templates/code-deploy.yml
    parameters:
      id: prod_code
      environment: prod
      serviceConnection: azure-prod
      after: prod_app
