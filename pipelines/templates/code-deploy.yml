# AD-17 step 9: code deploy for one environment (Story 1.2 places it; Story 1.3
# implements ci/code-deploy.sh). A no-op until infra/<env>/app exists.
parameters:
  - name: id
    type: string
  - name: environment # dev or prod
    type: string
  - name: serviceConnection
    type: string
  - name: after
    type: string

stages:
  - stage: ${{ parameters.id }}_check
    displayName: Code to deploy? (${{ parameters.environment }})
    dependsOn:
      - ${{ parameters.after }}_check
      - ${{ parameters.after }}
    # Go on when the previous step deployed, or when its check found nothing to do.
    condition: and(not(canceled()), or(eq(dependencies.${{ parameters.after }}.result, 'Succeeded'), and(eq(dependencies.${{ parameters.after }}_check.result, 'Succeeded'), eq(dependencies.${{ parameters.after }}_check.outputs['check.check.hasWork'], 'false'))))
    jobs:
      - job: check
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: ci/code-deploy.sh --check ${{ parameters.environment }}
            name: check
            displayName: Look for apps to deploy

  - stage: ${{ parameters.id }}
    displayName: Deploy code (${{ parameters.environment }})
    dependsOn: ${{ parameters.id }}_check
    condition: and(succeeded(), eq(dependencies.${{ parameters.id }}_check.outputs['check.check.hasWork'], 'true'))
    jobs:
      - deployment: deploy
        displayName: Code deploy (${{ parameters.environment }})
        environment: ${{ parameters.environment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: none
                - template: setup-tools.yml
                  parameters:
                    tools: [uv]
                    node: true
                - task: AzureCLI@2
                  displayName: Build and publish the apps
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: ci/code-deploy.sh
                    arguments: ${{ parameters.environment }}
