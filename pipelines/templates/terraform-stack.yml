# One Terraform stack in the deploy pipeline (Story 1.2, AD-17), as two stages:
#   <id>_check  plan -out=tfplan -detailed-exitcode, P-17 tag gate on `show -json`,
#               publish the saved plan (no environment, so no approval);
#   <id>        apply that saved plan in the ADO environment, only when the plan has
#               changes. Approvals are evaluated per stage, so a stack with no changes
#               asks for none. The approval check itself lives on the environment
#               (infra/bootstrap/ado-setup.sh), never in YAML.
parameters:
  - name: id # stage id, e.g. dev_foundation
    type: string
  - name: stack # <env>/<stack> under infra/
    type: string
  - name: environment # ADO environment: shared, dev or prod
    type: string
  - name: serviceConnection # WIF service connection of the stack owner
    type: string
  - name: after # id of the previous step in the AD-17 order ('' for the first)
    type: string
    default: ''
  - name: optional # the stack folder may not exist yet (e.g. <env>/app before Story 1.3)
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.id }}_check
    displayName: Plan ${{ parameters.stack }}
    ${{ if eq(parameters.after, '') }}:
      dependsOn: []
    ${{ else }}:
      dependsOn:
        - ${{ parameters.after }}_check
        - ${{ parameters.after }}
      # Go on when the previous step deployed, or when its check found nothing to do;
      # a gated stage skipped for any other reason (e.g. an approval that timed out) stops here.
      condition: and(not(canceled()), or(eq(dependencies.${{ parameters.after }}.result, 'Succeeded'), and(eq(dependencies.${{ parameters.after }}_check.result, 'Succeeded'), eq(dependencies.${{ parameters.after }}_check.outputs['check.check.hasWork'], 'false'))))
    jobs:
      - job: check
        displayName: terraform plan ${{ parameters.stack }}
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - template: setup-tools.yml
            parameters:
              tools: [terraform]
          - task: AzureCLI@2
            name: check
            displayName: Plan and tag gate
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: scriptPath
              scriptPath: ci/terraform-plan.sh
              addSpnToEnvironment: true
              ${{ if eq(parameters.optional, true) }}:
                arguments: ${{ parameters.stack }} $(Build.ArtifactStagingDirectory)/plan --optional
              ${{ else }}:
                arguments: ${{ parameters.stack }} $(Build.ArtifactStagingDirectory)/plan
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken) # azurerm refreshes its OIDC token (ci/lib.sh)
          # The saved plan holds sensitive values; it must cross to the apply agent, so it is
          # published. Who can read it and its retention: infra/bootstrap/README.md.
          - publish: $(Build.ArtifactStagingDirectory)/plan
            displayName: Publish saved plan
            artifact: tfplan-${{ parameters.id }}
            condition: and(succeeded(), eq(variables['check.hasWork'], 'true'))

  - stage: ${{ parameters.id }}
    displayName: Apply ${{ parameters.stack }}
    dependsOn: ${{ parameters.id }}_check
    condition: and(succeeded(), eq(dependencies.${{ parameters.id }}_check.outputs['check.check.hasWork'], 'true'))
    jobs:
      - deployment: apply
        displayName: terraform apply ${{ parameters.stack }}
        environment: ${{ parameters.environment }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan-${{ parameters.id }}
                - template: setup-tools.yml
                  parameters:
                    tools: [terraform]
                - task: AzureCLI@2
                  displayName: Apply the saved plan
                  inputs:
                    azureSubscription: ${{ parameters.serviceConnection }}
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: ci/terraform-apply.sh
                    addSpnToEnvironment: true
                    arguments: ${{ parameters.stack }} $(Pipeline.Workspace)/tfplan-${{ parameters.id }}/tfplan
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
